<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Таро — личный справочник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="top" aria-label="Разделы">
  <div class="tabs" id="tabs">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/></svg>Вопрос</button>
    <button data-tab="read"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="7" height="12" rx="1.5" transform="rotate(-8 6.5 11)"/><rect x="13" y="5" width="7" height="12" rx="1.5" transform="rotate(8 16.5 11)"/></svg>Расклад</button>
    <button data-tab="spreads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="7" rx="1.5"/><rect x="14" y="4" width="6" height="7" rx="1.5"/><rect x="9" y="13" width="6" height="7" rx="1.5"/></svg>Схемы</button>
    <button data-tab="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h10a2 2 0 0 1 2 2v14l-4-2-4 2-4-2V6a2 2 0 0 1 0-2z"/><path d="M9 8h5M9 11h5"/></svg>Карты</button>
    <button data-tab="decks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M3 6v12M21 6v12"/></svg>Колоды</button>
    <button data-tab="journal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>Дневник</button>
  </div>
</nav>

<main>
  <!-- ——— Вопрос ——— -->
  <section id="tab-home" class="tab on">
    <div class="home">
      <div class="home-lock">
        <div class="home-date" id="homeDate"></div>
        <h1 class="home-title">Задай свой вопрос</h1>
        <p class="home-sub">Карты подскажут, как их значения связаны. Толкование остаётся за тобой.</p>
        <div class="home-widgets">
          <div class="widget"><h4>Карта дня</h4><div class="daycard" id="dayCard"></div></div>
          <div class="widget"><h4>Таро XV века</h4><div class="home-cards" id="homeCards"></div></div>
        </div>
      </div>
      <form class="home-card" id="homeForm">
        <h3>Вопрос</h3>
        <textarea class="input" id="homeQ" placeholder="Например: как сложатся мои финансы в этом месяце?"></textarea>
        <div class="theme-auto" id="homeTheme"></div>
        <div class="chips" id="homeChips"></div>
        <h3>Расклад</h3>
        <div class="spread-pick" id="homeSpreads"></div>
        <button class="btn go" type="submit">Разложить карты</button>
      </form>
    </div>
    <div class="home-art" id="homeArt"></div>
  </section>

  <!-- ——— Расклад ——— -->
  <section id="tab-read" class="tab">
    <div class="read-grid">
      <aside class="setup">
        <div class="step">
          <h3><span class="num">1</span> Тема</h3>
          <div class="chips" id="themeChips"></div>
          <input id="question" class="input" placeholder="Ваш вопрос (необязательно)">
        </div>
        <div class="step">
          <h3><span class="num">2</span> Схема</h3>
          <select id="spreadSelect" class="input"></select>
          <p class="hint" id="spreadHint"></p>
        </div>
        <div class="step">
          <h3><span class="num">3</span> Карты</h3>
          <label class="switch"><input type="checkbox" id="useRev" checked> <span>Учитываю перевёрнутые карты</span></label>
          <div id="slots" class="slots"></div>
          <div class="row-btns">
            <button class="btn ghost" id="randomBtn" title="Вытянуть случайную карту из оставшихся">🎲 Случайная</button>
            <button class="btn ghost" id="clearBtn">Очистить</button>
          </div>
        </div>
      </aside>

      <div class="picker">
        <div class="picker-head">
          <div class="suit-tabs" id="suitTabs"></div>
          <input id="cardSearch" class="input small" placeholder="Поиск: «императрица», «паж кубков»…">
        </div>
        <p class="hint" id="pickHint"></p>
        <div class="card-grid" id="cardGrid"></div>
      </div>
    </div>

    <div id="result" class="result"></div>
  </section>

  <!-- ——— Схемы ——— -->
  <section id="tab-spreads" class="tab">
    <div class="spreads-grid">
      <aside class="spread-list" id="spreadList"></aside>
      <article class="spread-detail" id="spreadDetail"></article>
    </div>
  </section>

  <!-- ——— Карты ——— -->
  <section id="tab-cards" class="tab">
    <div class="picker-head">
      <div class="suit-tabs" id="libSuitTabs"></div>
      <input id="libSearch" class="input small" placeholder="Поиск по названию или ключевым словам">
    </div>
    <div class="card-grid lib" id="libGrid"></div>
  </section>

  <!-- ——— Колоды ——— -->
  <section id="tab-decks" class="tab">
    <div id="decksView"></div>
  </section>

  <!-- ——— Дневник ——— -->
  <section id="tab-journal" class="tab">
    <div id="journalView"></div>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <button class="modal-x" id="modalX" aria-label="Закрыть">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="data/meta.js"></script>
<script src="data/cards-major.js"></script>
<script src="data/cards-cups-pentacles.js"></script>
<script src="data/cards-swords-wands.js"></script>
<script src="data/spreads.js"></script>
<script src="decks/decks.js"></script>
<script src="js/art.js"></script>
<script src="js/customdecks.js"></script>
<script src="js/interpret.js"></script>
<script src="js/app.js"></script>
</body>
</html>
